<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Contactez-moi</title>
</head>

<body>

    <form>

        <fieldset>

            <legend>Contactez-moi</legend>


            <label>Civilité :</label>

            <input type="radio" name="civilite" value="Monsieur" checked>
            <label>Monsieur</label>

            <input type="radio" name="civilite" value="Madame">
            <label>Madame</label>

            <input type="radio" name="civilite" value="Mademoiselle">
            <label>Mademoiselle</label>

            <br><br>


            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom"
                   placeholder="Votre nom" required>

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom"
                   placeholder="Votre prénom" required>

            <br><br>


            <label for="email">Email :</label>
            <input type="email" id="email" name="email"
                   placeholder="Votre e-mail" required>

            <label for="telephone">Téléphone :</label>
            <input type="tel" id="telephone" name="telephone"
                   placeholder="Votre téléphone"
                   pattern="9[0-9]{7}"
                   title="Le numéro doit contenir 8 chiffres et commencer par 9"
                   required>

            <br><br>

            <label for="sujet">Sujet :</label>
            <input type="text" id="sujet" name="sujet"
                   placeholder="Votre sujet" required>

            <br><br>


            <label for="message">Message :</label>

            <br><br>

            <textarea id="message" name="message"
                      rows="10" cols="45"
                      required></textarea>

            <br><br>


            <!-- Boutons -->
            <input type="submit" value="Envoyer">
            <input type="reset" value="Annuler">

        </fieldset>

    </form>

</body>

</html>
